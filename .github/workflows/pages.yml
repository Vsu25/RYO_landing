name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public landing
        run: |
          mkdir -p public-site/public/media public-site/vendor
          cp website/index.html website/styles.css website/scroll-story.css website/scroll-story.js website/menu-data.js website/robots.txt website/sitemap.xml public-site/
          cp website/vendor/gsap.min.js website/vendor/ScrollTrigger.min.js public-site/vendor/
          cp website/public/media/box-front.jpg website/public/media/box-closed.webp website/public/media/box-open.webp public-site/public/media/
          cp website/public/media/roll-sei.webp website/public/media/roll-koga.webp website/public/media/roll-yuzu.webp website/public/media/roll-playboy.webp public-site/public/media/
          cp website/public/media/ryo-overlapping-arcs-pattern.png website/public/media/ryo-wordmark-gold.png public-site/public/media/
          cp website/public/media/ryo-scroll-intro-v2.mp4 website/public/media/ryo-scroll-open-playboy-v2.mp4 website/public/media/ryo-scroll-return-close-v2.mp4 public-site/public/media/
      - name: Upload landing
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
